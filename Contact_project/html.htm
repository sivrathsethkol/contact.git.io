<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Contact Book</title>
    <style>
      :root {
        --bg-color: #0f172a;
        --card-bg: #1e293b;
        --text-main: #f8fafc;
        --text-sub: #94a3b8;
        --accent: #6366f1;
        --accent-hover: #4f46e5;
        --danger: #ef4444;
        --border: #334155;
        --radius: 12px;
      }

      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-main);
        margin: 0;
        padding: 2rem 1rem;
        display: flex;
        justify-content: center;
      }

      .container {
        width: 100%;
        max-width: 600px;
        background-color: var(--card-bg);
        padding: 2rem;
        border-radius: var(--radius);
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
        border: 1px solid var(--border);
      }

      h1 {
        margin-top: 0;
        text-align: center;
        font-size: 1.75rem;
        margin-bottom: 1.5rem;
      }

      .form-group {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        margin-bottom: 1.5rem;
      }

      .row {
        display: flex;
        gap: 0.5rem;
      }

      input[type="text"],
      input[type="tel"],
      select {
        flex: 1;
        padding: 0.75rem 1rem;
        background-color: #0f172a;
        border: 1px solid var(--border);
        color: var(--text-main);
        border-radius: 8px;
        font-size: 0.95rem;
        outline: none;
        transition: border-color 0.2s;
      }

      input:focus,
      select:focus {
        border-color: var(--accent);
      }

      button.btn-primary {
        background-color: var(--accent);
        color: white;
        border: none;
        padding: 0.75rem 1.25rem;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.4rem;
      }

      button.btn-primary:hover {
        background-color: var(--accent-hover);
      }

      .search-box {
        margin-bottom: 1.25rem;
      }

      .search-box input {
        width: 100%;
        box-sizing: border-box;
      }

      .stats {
        font-size: 0.85rem;
        color: var(--text-sub);
        margin-bottom: 1rem;
      }

      ul {
        list-style: none;
        padding: 0;
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        max-height: 380px;
        overflow-y: auto;
      }

      li.contact-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.85rem 1rem;
        background-color: #0f172a;
        border: 1px solid var(--border);
        border-radius: 8px;
      }

      .contact-details {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }

      .contact-avatar {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        object-fit: cover;
        border: 1px solid var(--border);
        background-color: #1e293b;
      }

      .contact-info {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
      }

      .contact-name {
        font-weight: 600;
        font-size: 1rem;
      }

      .contact-phone {
        font-size: 0.85rem;
        color: var(--text-sub);
      }

      .contact-meta {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .badge {
        font-size: 0.7rem;
        padding: 0.2rem 0.5rem;
        border-radius: 4px;
        font-weight: 600;
        text-transform: uppercase;
        background-color: #334155;
        color: #cbd5e1;
      }

      .delete-btn {
        background: none;
        border: none;
        color: var(--text-sub);
        font-size: 1.25rem;
        cursor: pointer;
        padding: 0 0.25rem;
        transition: color 0.2s;
        justify-content: center;
        align-items: center;
      }

      .delete-btn:hover {
        color: var(--danger);
      }

      .empty-state {
        text-align: center;
        color: var(--text-sub);
        padding: 2rem;
        font-style: italic;
      }

      .dlt {
        background-color: rgb(234, 41, 41);
        color: rgb(255, 254, 254);
        padding: 0;
        margin: 1.5rem 0 0 0;
        font-family: monospace;
        border: none;
        border-radius: 7px;
        width: 100px;
        height: 20px;
        cursor: pointer;
      }

      .dlt:hover {
        background-color: tomato;
      }

      .edit-btn {
        background-color: navy;
        color: white;
        border: none;
        border-radius: 3px;
        font-size: 1rem;
        font-family: "Times New Roman", Times, serif;
        cursor: pointer;
        padding: 0.3rem 0.6rem;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.4rem;
      }

      .edit-btn:hover {
        background-color: rgb(18, 18, 139);
      }

      .image-preview {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.85rem;
        color: var(--text-sub);
      }

      .preview-thumb {
        width: 29px;
        height: 29px;
        border-radius: 50%;
        object-fit: cover;
        display: none;
      }

      .call-btn {
        background-color: #10b981;
        color: white;
        text-decoration: none;
        padding: 5px;
        border-radius: 3px;
        font-size: 0.7rem;
        font-family: system-ui, sans-serif;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition: background-color 0.2s;
        width: 60px;
      }

      .call-btn:hover {
        background-color: #059669;
      }
      .call-btn:active {
        background-color: greenyellow;
      }

      /* MODAL STYLES */
      .modal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.7);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 1000;
      }

      .modal-content {
        background-color: var(--card-bg);
        padding: 2rem;
        border-radius: var(--radius);
        border: 1px solid var(--border);
        width: 90%;
        max-width: 400px;
        box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5);
      }

      .modal-content h3 {
        margin-top: 0;
        margin-bottom: 1rem;
        text-align: center;
      }

      .modal-buttons {
        display: flex;
        gap: 0.5rem;
        justify-content: flex-end;
        margin-top: 1rem;
      }

      .btn-secondary {
        background-color: #334155;
        color: white;
        border: none;
        padding: 0.75rem 1.25rem;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.4rem;
      }

      .btn-secondary:hover {
        background-color: #475569;
      }

      .btn-danger {
        background-color: var(--danger);
        color: white;
        border: none;
        padding: 0.75rem 1.25rem;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.4rem;
      }

      .btn-danger:hover {
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Contact Book</h1>

      <!-- Inputs to add a new contact -->
      <div class="form-group">
        <div class="row">
          <input type="text" id="nameInput" placeholder="Name (e.g. Alex Smith)" />
          <input
            type="tel"
            id="phoneInput"
            placeholder="Phone (e.g. 012-345-6789)"
            pattern="[0-9]"
            inputmode="numeric"
          />
        </div>
        <div class="row">
          <select id="categoryInput">
            <option value="Personal">Personal</option>
            <option value="Work">Work</option>
            <option value="Family">Family</option>
          </select>
          <button type="button" id="submitBtn" class="btn-primary" onclick="addContact()">
            Add Contact
          </button>
        </div>
      </div>

      <!-- Hidden file input for adding new contact image -->
      <input
        type="file"
        id="imageInput"
        accept="image/*"
        style="display: none"
        onchange="handleImageSelect(event, 'add')"
      />

      <!-- Insert-image button added right above the search contacts bar -->
      <div style="margin-bottom: 0.75rem; display: flex; align-items: center; gap: 0.5rem;">
        <button
          type="button"
          class="btn-secondary"
          onclick="document.getElementById('imageInput').click()"
          style="flex: 1"
        >
          insert-image
        </button>
        <div class="image-preview">
          <img id="addImgPreview" class="preview-thumb" alt="Preview" />
        </div>
      </div>

      <!-- Search filter bar -->
      <div class="search-box">
        <input
          type="text"
          id="searchInput"
          placeholder="Search contacts..."
          oninput="renderContacts()"
        />
      </div>

      <!-- Contact Stats counter -->
      <div class="stats" id="contactStats">Total Contacts: 0</div>

      <!-- Contact List Output -->
      <ul id="contactList"></ul>
      <div>
        <button class="dlt" onclick="deleteAll()">delete all</button>
      </div>
    </div>

    <!-- EDIT MODAL HTML -->
    <div id="editModal" class="modal" style="display: none">
      <div class="modal-content">
        <h3>Edit Contact</h3>
        <div class="form-group">
          <input type="text" id="editNameInput" placeholder="Name" />
          <input type="tel" id="editPhoneInput" placeholder="Phone" />
          <select id="editCategoryInput">
            <option value="Personal">Personal</option>
            <option value="Work">Work</option>
            <option value="Family">Family</option>
          </select>

          <!-- Hidden file input for modal contact image editing -->
          <input
            type="file"
            id="editImageInput"
            accept="image/*"
            style="display: none"
            onchange="handleImageSelect(event, 'edit')"
          />

          <!-- Insert-image button added inside the mini tab form group -->
          <div style="display: flex; align-items: center; gap: 0.5rem">
            <button
              type="button"
              class="btn-secondary"
              onclick="document.getElementById('editImageInput').click()"
              style="flex: 1"
            >
              insert-image
            </button>
            <div class="image-preview">
              <img id="editImgPreview" class="preview-thumb" alt="Preview" />
            </div>
          </div>
        </div>
        <div class="modal-buttons">
          <button type="button" class="btn-danger" onclick="deleteCurrentEditingContact()">
            Delete
          </button>
          <button type="button" class="btn-primary" onclick="saveEditedContact()">
            Save
          </button>
          <button type="button" class="btn-secondary" onclick="closeEditModal()">
            Cancel
          </button>
        </div>
      </div>
    </div>

    <!-- MINI CALL MODAL -->
    <div id="callModal" class="modal" style="display: none;">
      <div class="modal-content" style="text-align: center;">
        <h3>Initiating Call</h3>
        <img id="callModalAvatar" src="" alt="Avatar" style="width: 60px; height: 60px; border-radius: 50%; object-fit: cover; margin-bottom: 0.5rem; border: 1px solid var(--border);">
        <div id="callModalInfo" style="margin: 1rem 0; color: var(--text-sub); font-size: 0.95rem;"></div>
        <div class="modal-buttons" style="justify-content: center;">
          <button type="button" class="btn-secondary" onclick="closeCallModal()">Cancel</button>
        </div>
      </div>
    </div>

    <script>
      let editingId = null;
      let selectedAddImage = "";
      let selectedEditImage = "";

      // Default fallback SVG avatar if no image is uploaded
      const defaultAvatar =
        "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' fill='%2394a3b8' viewBox='0 0 24 24'><path d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/></svg>";

      // Load contacts from LocalStorage or initialize with default sample data
      let contacts = JSON.parse(localStorage.getItem("myContacts")) || [
        {
          id: 1,
          name: "Siv Sethkol",
          phone: "0123456789",
          category: "Personal",
          image: "",
        },
        {
          id: 2,
          name: "Project Team",
          phone: "0987654321",
          category: "Work",
          image: "",
        },
      ];

      // Open the mini call tab
      function openCallModal(name, phone, imageSrc) {
        const modal = document.getElementById("callModal");
        const info = document.getElementById("callModalInfo");
        const modalAvatar = document.getElementById("callModalAvatar");

        modalAvatar.src = imageSrc ? imageSrc : defaultAvatar;
        info.innerHTML = `Calling <strong>${name}</strong><br><span style="font-size: 0.85rem;">(${phone})</span>`;
        
        modal.style.display = "flex";
        window.location.href = `tel:${phone}`;
      }
    
      // Close the mini call tab
      function closeCallModal() {
        document.getElementById("callModal").style.display = "none";
      }

      // Handles reading image file inputs and converting them into Base64 strings
      function handleImageSelect(event, mode) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function (e) {
          if (mode === "add") {
            selectedAddImage = e.target.result;
            const preview = document.getElementById("addImgPreview");
            preview.src = selectedAddImage;
            preview.style.display = "block";
          } else if (mode === "edit") {
            selectedEditImage = e.target.result;
            const preview = document.getElementById("editImgPreview");
            preview.src = selectedEditImage;
            preview.style.display = "block";
          }
        };
        reader.readAsDataURL(file);
      }

      // Renders the list of contacts onto the screen
      function renderContacts() {
        const list = document.getElementById("contactList");
        const searchTerm = document
          .getElementById("searchInput")
          .value.toLowerCase()
          .trim();

        list.innerHTML = "";

        // Filter contacts based on search query
        const filteredContacts = contacts.filter((c) => {
          return (
            c.name.toLowerCase().includes(searchTerm) ||
            c.phone.includes(searchTerm)
          );
        });

        if (filteredContacts.length === 0) {
          list.innerHTML = `<div class="empty-state">No contacts found.</div>`;
        } else {
          filteredContacts.forEach((contact) => {
            const li = document.createElement("li");
            li.className = "contact-item";

            const avatarSrc = contact.image ? contact.image : defaultAvatar;

            li.innerHTML = `
              <div class="contact-details">
                <img src="${avatarSrc}" alt="Avatar" class="contact-avatar">
                <div class="contact-info">
                  <span class="contact-name">${escapeHtml(contact.name)}</span>
                  <span class="contact-phone">📞 ${escapeHtml(contact.phone)}</span>
                  <a href="#" class="call-btn" title="Call Contact" onclick="openCallModal('${escapeHtml(contact.name)}', '${escapeHtml(contact.phone)}', '${avatarSrc}')">Call</a>
                </div>
              </div>
              
              <div class="contact-meta">
                <span class="badge">${escapeHtml(contact.category)}</span>
                <button type="button" class="edit-btn" onclick="editContact(${contact.id})" title="Edit Contact">Edit</button>
                <button class="delete-btn" onclick="deleteContact(${contact.id})" title="Delete Contact">&times;</button>
              </div>
            `;
            list.appendChild(li);
          });
        }

        updateStats();
        saveContacts();
      }

      // Editing text function
      function editContact(id) {
        const contactToEdit = contacts.find((c) => c.id === id);
        if (!contactToEdit) return;

        document.getElementById("editNameInput").value = contactToEdit.name;
        document.getElementById("editPhoneInput").value = contactToEdit.phone;
        document.getElementById("editCategoryInput").value = contactToEdit.category;

        selectedEditImage = contactToEdit.image || "";
        const preview = document.getElementById("editImgPreview");
        if (selectedEditImage) {
          preview.src = selectedEditImage;
          preview.style.display = "block";
        } else {
          preview.style.display = "none";
        }

        editingId = id;
        document.getElementById("editModal").style.display = "flex";
      }

      // Closes the modal popup without saving changes
      function closeEditModal() {
        document.getElementById("editModal").style.display = "none";
        editingId = null;
        selectedEditImage = "";
        document.getElementById("editImgPreview").style.display = "none";
      }

      // Saves modal changes back into the contacts array
      function saveEditedContact() {
        const name = document.getElementById("editNameInput").value.trim();
        const phone = document.getElementById("editPhoneInput").value.trim();
        const category = document.getElementById("editCategoryInput").value;

        if (name !== "" && phone !== "") {
          const Numberonly = /^[0-9]+$/.test(phone);
          if (!Numberonly) {
            alert("Please enter a number only!");
            return;
          }

          contacts = contacts.map((c) => {
            if (c.id === editingId) {
              return {
                ...c,
                name: name,
                phone: phone,
                category: category,
                image: selectedEditImage,
              };
            }
            return c;
          });

          editingId = null;
          selectedEditImage = "";
          document.getElementById("editImgPreview").style.display = "none";
          renderContacts();
          document.getElementById("editModal").style.display = "none";
        }
      }

      function deleteCurrentEditingContact() {
        if (editingId !== null) {
          if (confirm("Are you sure you want to delete this contact?")) {
            contacts = contacts.filter((c) => c.id !== editingId);
            editingId = null;
            renderContacts();
            document.getElementById("editModal").style.display = "none";
          }
        }
      }

      // Function to add a new contact to the array
      function addContact() {
        const nameInput = document.getElementById("nameInput");
        const phoneInput = document.getElementById("phoneInput");
        const categoryInput = document.getElementById("categoryInput");

        const name = nameInput.value.trim();
        const phone = phoneInput.value.trim();
        const category = categoryInput.value;

        if (name !== "" && phone !== "") {
          const Numberonly = /^[0-9]+$/.test(phone);
          if (!Numberonly) {
            alert("Please enter a number only!");
            return;
          }

          contacts.push({
            id: Date.now(),
            name: name,
            phone: phone,
            category: category,
            image: selectedAddImage,
          });

          nameInput.value = "";
          phoneInput.value = "";
          selectedAddImage = "";
          document.getElementById("addImgPreview").style.display = "none";
          document.getElementById("imageInput").value = "";

          renderContacts();
        }
      }

      // Function to delete a contact by ID
      function deleteContact(id) {
        contacts = contacts.filter((contact) => contact.id !== id);
        renderContacts();
      }

      // Updates the total contact counter
      function updateStats() {
        document.getElementById("contactStats").innerText =
          `Total Contacts: ${contacts.length}`;
      }

      // Saves the contacts array to LocalStorage
      function saveContacts() {
        localStorage.setItem("myContacts", JSON.stringify(contacts));
      }

      function deleteAll() {
        if (confirm("Are you sure you want to delete all contacts?")) {
          contacts = [];
          renderContacts();
        }
      }

      // Security helper function to clean input text
      function escapeHtml(str) {
        return str
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      document
        .getElementById("phoneInput")
        .addEventListener("keypress", function (e) {
          if (e.key === "Enter") addContact();
        });

      // Run render function on page load
      renderContacts();
    </script>
  </body>
</html>
